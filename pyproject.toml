[build-system]
requires = ["setuptools>=62.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yumcha"
version = "0.0.0"
description = "A declarative, phonology-oriented transliteration engine for Cantonese and other languages."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.package-data]
"yumcha" = ["data/**/*.tsv"]
