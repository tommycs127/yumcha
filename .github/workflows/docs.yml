name: Generate and Publish API Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx sphinx-rtd-theme sphinx-autodoc-typehints
          pip install -e .

      - name: Generate API Documentation
        run: |
          mkdir -p docs/source

          cat << 'EOF' > docs/source/conf.py
          import builtins
          from unittest.mock import MagicMock

          project = 'yumcha'
          copyright = '2026, yumcha'
          author = 'tommycs127'

          extensions = [
              'sphinx.ext.autodoc',
              'sphinx.ext.napoleon',
              'sphinx.ext.viewcode',
              'sphinx_autodoc_typehints'
          ]

          mock_names = [
              "BaseSolver",
              "ClusterCanonicalizer",
              "ClusterKey",
              "Indexer",
              "Language",
              "Pattern",
              "PatternIndexes",
              "PatternIndexesView",
              "PatternMasks",
              "PatternMasksView",
              "PatternTuple",
              "Phonology",
              "PhonologyData",
              "PhonologyDirective",
              "PhonologyDirectiveMap",
              "PhonologyRepresentation",
              "PhonologyRepresentationClsFn",
              "ProgressBarWrapper",
              "Representation",
              "Scheme",
              "SchemeData",
              "SchemeDirective",
              "SchemeRepresentation",
              "SchemeRepresentationClsFn",
              "Solution",
              "SolveFn",
          ]

          for name in mock_names:
              setattr(builtins, name, MagicMock())

          autodoc_mock_imports = mock_names

          always_document_param_types = True
          set_type_checking_flag = True

          autodoc_default_options = {
              'members': True,
              'undoc-members': True,
              'show-inheritance': True,
          }

          templates_path = ['_templates']
          exclude_patterns = []

          html_theme = 'sphinx_rtd_theme'
          html_static_path = ['_static']
          EOF

          cat << 'EOF' > docs/source/index.rst
          Welcome to yumcha's documentation!
          ==================================

          .. toctree::
              :maxdepth: 2
              :caption: Contents:

              modules

          Indices and tables
          ==================

          * :ref:`genindex`
          * :ref:`modindex`
          * :ref:`search`
          EOF

          rm -f docs/source/modules.rst docs/source/yumcha*.rst

          sphinx-apidoc --implicit-namespaces -o docs/source/ yumcha/
          sphinx-build -v -b html docs/source/ docs/build/html 2>&1 | tee sphinx-build.log

          touch docs/build/html/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html
