name: Generate and Publish API Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx sphinx-rtd-theme

      - name: Generate API Documentation
        run: |
          mkdir -p docs/source

          cat << 'EOF' > docs/source/conf.py
          import os
          import sys
          sys.path.insert(0, os.path.abspath('../../yumcha'))

          project = 'yumcha'
          copyright = '2026, yumcha'
          author = 'tommycs127'

          extensions = [
              'sphinx.ext.autodoc',
              'sphinx.ext.napoleon',
              'sphinx.ext.viewcode'
          ]

          autodoc_typehints = 'description'

          templates_path = ['_templates']
          exclude_patterns = []

          html_theme = 'sphinx_rtd_theme'
          html_static_path = ['_static']
          EOF

          cat << 'EOF' > docs/source/index.rst
          Welcome to yumcha's documentation!
          ==================================

          .. toctree::
              :maxdepth: 2
              :caption: Contents:

              modules

          Indices and tables
          ==================

          * :ref:`genindex`
          * :ref:`modindex`
          * :ref:`search`
          EOF

          sphinx-apidoc -o docs/source/ yumcha/
          sphinx-build -b html docs/source/ docs/build/html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html
